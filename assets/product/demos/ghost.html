<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人效画像 — 弟子王五</title>
<link rel="stylesheet" href="../raw/css/dashboard.css">
<link rel="stylesheet" href="demo-common.css">
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <h2>Sunlike ERP</h2>
    <div class="brand-sub">报表查询系统</div>
  </div>
  <div class="sidebar-user">
    <div class="avatar" id="userAvatar">护</div>
    <span id="userName">护法（执法堂）</span>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-item">报表查询</div>
    <div class="nav-item">考勤看板</div>
    <div class="nav-item">资源调度</div>
    <div class="nav-item active">人效画像</div>
  </nav>
</aside>
<main class="main-content">
  <header class="content-header">
    <h3>人效画像 — 弟子王五</h3>
    <div class="header-actions">
      <button class="btn btn-secondary btn-sm">刷新</button>
    </div>
  </header>
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-label">名义在岗</div>
      <div class="kpi-value">5 处</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">实际在岗</div>
      <div class="kpi-value danger">0 处</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">累计产出</div>
      <div class="kpi-value danger">0 项</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">全勤月例</div>
      <div class="kpi-value warn">5 份</div>
    </div>
  </div>
  <div class="chart-card">
    <div class="chart-title">各地产出对比</div>
    <div class="bar-row"><span class="bar-label">丹房</span><div class="bar-track"></div><span class="badge badge-muted">0</span></div>
    <div class="bar-row"><span class="bar-label">器房</span><div class="bar-track"></div><span class="badge badge-muted">0</span></div>
    <div class="bar-row"><span class="bar-label">剑阁</span><div class="bar-track"></div><span class="badge badge-muted">0</span></div>
    <div class="bar-row"><span class="bar-label">符堂</span><div class="bar-track"></div><span class="badge badge-muted">0</span></div>
    <div class="bar-row"><span class="bar-label">藏经阁</span><div class="bar-track"></div><span class="badge badge-muted">0</span></div>
  </div>
  <div class="table-container" style="margin:0 var(--space-xl)">
    <div class="table-toolbar">
      <span class="table-info">人效明细 · <strong>5 条</strong></span>
    </div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr><th>部门</th><th>名义在岗</th><th>实际在岗</th><th>产出</th></tr>
        </thead>
        <tbody>
          <tr><td>丹房</td><td><span class="badge badge-success">全勤</span></td><td>0</td><td>0</td></tr>
          <tr><td>器房</td><td><span class="badge badge-success">全勤</span></td><td>0</td><td>0</td></tr>
          <tr><td>剑阁</td><td><span class="badge badge-success">全勤</span></td><td>0</td><td>0</td></tr>
          <tr><td>符堂</td><td><span class="badge badge-success">全勤</span></td><td>0</td><td>0</td></tr>
          <tr><td>藏经阁</td><td><span class="badge badge-success">全勤</span></td><td>0</td><td>0</td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="callout">五处挂职，处处幽灵——什么，都没做成</div>
</main>
</body>
</html>
